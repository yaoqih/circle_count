name: windows-build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build renderer and electron bundles
        run: npm run build

      - name: Package Windows app
        run: npm run dist:win

      - name: Publish latest Windows package to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: windows-build-latest
          name: Windows Build Latest
          artifacts: "release/*.exe,release/*.blockmap,release/latest*.yml"
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          artifactErrorsFailBuild: true
          body: |
            Automated Windows package from the latest `main` build.
