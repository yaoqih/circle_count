name: windows-build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build renderer and electron bundles
        run: npm run build

      - name: Package Windows app
        run: npm run dist

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: circle-label-windows
          path: release/*
          if-no-files-found: error
